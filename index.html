<style>
:root{--negro:#000204;--naranja:#f8972d;--grafito:#1c1d21;--linea:#2e3036;--gris:#a7a9ad;--blanco:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:#0d0e11;color:var(--blanco);font-family:Poppins,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--naranja);outline-offset:2px}
.top{max-width:430px;margin:0 auto;padding:16px 16px 12px;display:flex;flex-direction:column;gap:12px}
.top-t{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top-t b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-style:italic;font-weight:800;font-size:22px;text-transform:uppercase;color:var(--naranja)}
.top-t span{font-size:12px;color:var(--gris)}
.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.nav button{min-height:40px;border-radius:999px;border:2px solid var(--linea);font-size:13px;font-weight:600}
.nav button[aria-pressed="true"]{background:var(--blanco);color:var(--negro);border-color:var(--blanco)}
.phone{width:390px;max-width:100%;height:844px;margin:0 auto 32px;background:var(--negro);border-radius:28px;border:1px solid var(--linea);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media (max-width:480px){.top{padding:12px 12px 10px}.phone{width:100%;height:calc(100dvh - 104px);min-height:560px;border-radius:0;border:0;margin:0}}
.hd{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--linea);min-height:74px;flex-shrink:0}
.hd.nob{border-bottom:0}
.logo{height:30px;width:auto;display:block}
.back{width:44px;height:44px;border-radius:999px;border:1px solid var(--linea);display:flex;align-items:center;justify-content:center}
.who{text-align:right}.who .r{font-size:12px;color:var(--gris);letter-spacing:.2em;text-transform:uppercase;font-weight:500}.who .n{font-size:14px;font-weight:600}
main{flex:1;overflow-y:auto;padding:20px 20px 112px;display:flex;flex-direction:column;gap:16px}
main.nocta{padding-bottom:28px}
.rot{font-size:12px;color:var(--gris);letter-spacing:.25em;text-transform:uppercase;font-weight:500}
.disp{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-style:italic;font-weight:800;text-transform:uppercase;line-height:.9}
h1.disp{margin:4px 0 0;font-size:44px;color:var(--naranja)}
.card{background:var(--grafito);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--grafito);border-radius:12px;padding:12px}
.kpi .l{font-size:12px;color:var(--gris)}.kpi .v{font-family:"Barlow Condensed";font-style:italic;font-weight:800;font-size:30px;line-height:1}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.muted{color:var(--gris)}
.tag{display:inline-block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-style:italic;font-weight:800;font-size:18px;line-height:1;text-transform:uppercase;padding:6px 16px 5px;border-radius:999px;white-space:nowrap}
.tag.s{background:var(--naranja);color:var(--negro)}.tag.c{border:2px solid var(--naranja)}
.btn{font-weight:600;font-size:15px;min-height:44px;padding:0 20px;border-radius:999px;border:2px solid var(--naranja);display:flex;align-items:center;justify-content:center;width:100%;text-align:center;text-decoration:none}
.btn.p{background:var(--naranja);color:var(--negro)}.btn.o{color:var(--blanco)}
.btn:disabled{opacity:.4}
.cta{position:absolute;left:20px;right:20px;bottom:24px}.cta .btn{min-height:52px;font-size:16px}
.chip{min-height:44px;border-radius:999px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;border:2px solid var(--linea);background:var(--grafito);padding:4px 8px}
.chip.on{background:var(--naranja);color:var(--negro);border-color:var(--naranja)}
.chip.sq{border-radius:12px;min-height:48px}
.chip.off{background:transparent;color:#5b5e63;border-color:var(--grafito);text-decoration:line-through}
.opt{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;border:2px solid var(--linea);text-align:left;width:100%}
.opt.on{background:var(--grafito);border-color:var(--naranja)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;color:var(--gris)}
input{height:48px;border-radius:12px;background:var(--grafito);border:1px solid var(--linea);color:var(--blanco);padding:0 14px;font:inherit;font-size:16px;width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bar{height:10px;border-radius:999px;background:var(--grafito);overflow:hidden}.bar i{display:block;height:10px;border-radius:999px}
.toast{position:absolute;left:20px;right:20px;bottom:92px;background:var(--blanco);color:var(--negro);border-radius:12px;padding:12px 16px;font-size:14px;font-weight:500;line-height:1.4;z-index:5}
.big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-style:italic;font-weight:800;color:var(--naranja);line-height:1}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 20px 14px;border-bottom:1px solid var(--linea);flex-shrink:0}
.tabs button{min-height:44px;border-radius:999px;border:2px solid var(--linea);font-size:14px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--blanco);color:var(--negro);border-color:var(--blanco)}
.foto{height:90px;border-radius:4px;background:var(--linea);display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:600;letter-spacing:.2em}
a{color:var(--naranja)}
</style>
</head>
<body>

/* ---------- Dirección ---------- */
var DATA={hoy:['hoy',359800,6,[35,55,10],[['Lavado Full',3],['Limpieza de motor',1],['Restauración de ópticas',1]]],mes:['este mes',4862300,118,[30,60,10],[['Lavado Full',64],['Limpieza de motor',18],['Lavado de mantenimiento',14]]],q:['últimos 90 días',13940500,341,[32,58,10],[['Lavado Full',187],['Limpieza de motor',49],['Lavado de mantenimiento',38]]]};

      '<section class="card" style="gap:12px"><div class="lbl">Turnos por semana · últimas 6</div><div role="img" aria-label="Turnos por semana: '+SEM.join(', ')+'" style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end">'+bars+'</div></section>'+
      '<section><div class="lbl" style="margin-bottom:4px">Servicios más pedidos · '+d[0]+'</div>'+d[4].map(function(t){ return '<div class="row" style="font-size:14px;padding:10px 0;border-bottom:1px solid var(--linea)"><span>'+t[0]+'</span><b>'+t[1]+'</b></div>'; }).join('')+'</section>'+
      '<div class="row" style="border:2px solid var(--naranja);border-radius:12px;padding:14px 16px"><div><div style="font-size:15px;font-weight:600">18 clientes para reactivar</div><div class="muted" style="font-size:12px">Más de 30 días sin venir</div></div><button class="btn p" style="width:auto;min-height:40px;padding:0 16px;font-size:13px" data-a="dirScreen" data-v="reac">Ver lista</button></div>'+
      '<div class="card" style="gap:2px"><div style="font-size:15px;font-weight:600">2 cobros con diferencia</div><div class="muted" style="font-size:12px">Turnos pagados donde los montos no cuadran con el valor</div></div></main>';
    return '<header class="hd">'+LOGO+'<div class="who"><div class="r">Dirección</div><div class="n">Hola, Miguel</div></div></header>'+m;

  m='<main class="nocta"><div><div class="rot">Más de 30 días sin venir</div><h1 class="disp">Reactivación</h1><p class="muted" style="margin:6px 0 0;font-size:13px;line-height:1.4">El mensaje sale con el texto del manual de marca y el nombre de cada cliente.</p></div>'+

/* ---------- Acciones ---------- */
var A = {
  go:function(v){ S.view=v; S.toast=''; },
  recScreen:function(v){ S.rec.screen=v; },
  recAct:function(v){ var id=+v, r=S.rec, e=r.estados[id], t=null; recAll().forEach(function(x){ if(x.id===id) t=x; });
    if(e==='espera'){ r.estados[id]='curso'; aviso('Turno en curso. Queda registrada la hora de inicio.'); }
    else if(e==='curso'){ r.estados[id]='listo'; aviso('Se abre WhatsApp con el mensaje: «'+t.cliente.split(' ')[0]+', tu auto ya está listo».'); }
    else if(e==='listo'){ r.cobId=id; r.medio='Mercadopago'; r.screen='cobro'; } },
  recTipo:function(v){ S.rec.tipo=v; },
  recSvc:function(v){ S.rec.svc=v; },
  recCrear:function(){ var r=S.rec, sel=svc(r.svc), pr=sel.p[r.tipo];
    if(!pr){ aviso('Cargá el precio de este servicio para crear el turno.'); return; }
    var id=6+r.extra.length; r.extra.push({id:id,hora:r.extra.length?'17:30':'17:00',cliente:r.cliente||'Cliente nuevo',auto:r.vehiculo||'Vehículo',tipo:r.tipo,servicio:sel.name,precio:pr});
    r.estados[id]='espera'; r.screen='hoy'; aviso('Turno creado. La confirmación sale por WhatsApp.'); },
  recMedio:function(v){ S.rec.medio=v; },
  recCobrar:function(){ var r=S.rec, t=null; recAll().forEach(function(x){ if(x.id===r.cobId) t=x; });
    r.estados[r.cobId]='pagado'; r.pagos[r.cobId]=r.medio; r.screen='hoy'; aviso('Cobro registrado: '+fmt(t.precio)+' con '+r.medio+'.'); },
  resSvc:function(v){ S.res.svc=v; },
  resTipo:function(v){ S.res.tipo=v; },
  resDia:function(v){ S.res.dia=+v; S.res.hora=null; },
  resHora:function(v){ S.res.hora=v; },
  resBack:function(){ S.res.step--; },
  resNext:function(){ S.res.step++; },
  resReset:function(){ S.res={step:1,svc:null,tipo:null,modelo:'',dia:null,hora:null,tel:S.res.tel}; },
  porTab:function(v){ S.por.tab=v; },
  dirPer:function(v){ S.dir.per=v; },
  dirScreen:function(v){ S.dir.screen=v; },
  dirSend:function(v){ S.dir.sent[v]=true; aviso('Se abre WhatsApp con el mensaje de reactivación.'); }
};

var app=document.getElementById('app'), nav=document.getElementById('nav');
function render(){
  nav.innerHTML=VIEWS.map(function(v){ return '<button aria-pressed="'+(v[0]===S.view)+'" data-a="go" data-v="'+v[0]+'">'+v[1]+'</button>'; }).join('');
  var main=app.querySelector('main'), keep=main?main.scrollTop:0, prevKey=app.dataset.key;
  var html={rec:viewRec,res:viewRes,por:viewPor,dir:viewDir}[S.view]();
  if(S.toast) html+='<div class="toast" role="status">'+esc(S.toast)+'</div>';
  app.innerHTML=html;
  var key=S.view+'|'+S.rec.screen+'|'+S.res.step+'|'+S.por.tab+'|'+S.dir.screen;
  app.dataset.key=key;
  var nm=app.querySelector('main'); if(nm && key===prevKey) nm.scrollTop=keep;
}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b||b.disabled) return;
  A[b.dataset.a](b.dataset.v); render();
});
document.addEventListener('input',function(e){
  var m=e.target.dataset.m; if(!m) return; var k=m.split('.'); S[k[0]][k[1]]=e.target.value;
  if(m==='res.tel'){ var c=app.querySelector('[data-a="resNext"]'); if(c) c.disabled=!e.target.value; }
});
render();
